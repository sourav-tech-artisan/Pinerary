name: pinerary

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: pinerary
      POSTGRES_USER: pinerary
      POSTGRES_PASSWORD: pinerary
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinerary -d pinerary"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pinerary
      MINIO_ROOT_PASSWORD: pinerary-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.0
    environment:
      tile_urls: https://download.bbbike.org/osm/bbbike/NewDelhi/NewDelhi.osm.pbf
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      build_tar: "True"
      server_threads: "2"
      use_tiles_ignore_pbf: "False"
    ports:
      - "8002:8002"
    volumes:
      - valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m

volumes:
  postgres-data:
  minio-data:
  valhalla-data:
