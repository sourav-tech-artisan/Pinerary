openapi: 3.0.3
info:
  title: Pinerary API
  version: 0.1.0
  description: API for recording journeys, places, route traces, photos, and public itineraries.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current user and preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        default: {$ref: "#/components/responses/Error"}
  /devices:
    get:
      operationId: listDevices
      responses:
        "200":
          description: Registered devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/Error"
  /devices/{deviceId}:
    delete:
      operationId: deleteDevice
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Device removed}
        default: {$ref: "#/components/responses/Error"}
  /journeys:
    get:
      operationId: listJourneys
      parameters:
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Journeys owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createJourney
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJourneyRequest"
      responses:
        "201":
          description: Journey created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    get:
      operationId: getJourney
      responses:
        "200":
          description: Journey detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateJourney
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJourneyRequest"
      responses:
        "200":
          description: Journey updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/end:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: endJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Journey ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/convert-to-trip:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: convertOutingToTrip
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Outing converted to trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default: {$ref: "#/components/responses/Error"}
  /journeys/{journeyId}/locations/batch:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: ingestLocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/LocationPoint"
      responses:
        "202":
          description: Location samples accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationIngestResult"
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/route:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    get:
      operationId: getJourneyRoute
      responses:
        "200":
          description: Cleaned route segments, map-matched when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSegmentList"
        default: {$ref: "#/components/responses/Error"}
  /journeys/{journeyId}/stops:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: addJourneyStop
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PinStopRequest"}
      responses:
        "201":
          description: Stop added to the immutable timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyStop"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listJourneyStops
      responses:
        "200":
          description: Original chronological stop timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyStopList"
        default: {$ref: "#/components/responses/Error"}
  /journeys/{journeyId}/stops/{stopId}:
    patch:
      operationId: updateJourneyStopMetadata
      parameters:
        - $ref: "#/components/parameters/JourneyID"
        - {name: stopId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStopRequest"
      responses:
        "200":
          description: Editable stop metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyStop"
        default: {$ref: "#/components/responses/Error"}
  /places:
    get:
      operationId: listPlaces
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Saved place library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: savePlace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SavePlaceRequest"}
      responses:
        "201":
          description: Place saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        default:
          $ref: "#/components/responses/Error"
  /places/{placeId}:
    parameters:
      - {name: placeId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updatePlace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaceRequest"
      responses:
        "200":
          description: Place metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deletePlace
      responses:
        "204": {description: Place removed from the library}
        default: {$ref: "#/components/responses/Error"}
  /places/nearby:
    get:
      operationId: getNearbyPlaces
      parameters:
        - {name: latitude, in: query, required: true, schema: {type: number, format: double}}
        - {name: longitude, in: query, required: true, schema: {type: number, format: double}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
        - {name: mode, in: query, schema: {$ref: "#/components/schemas/TransportMode"}}
      responses:
        "200":
          description: Saved places ordered by road distance for the selected mode, with all available mode estimates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyResult"
        default:
          $ref: "#/components/responses/Error"
  /places/reverse-geocode:
    get:
      operationId: reverseGeocode
      parameters:
        - {name: latitude, in: query, required: true, schema: {type: number, format: double}}
        - {name: longitude, in: query, required: true, schema: {type: number, format: double}}
      responses:
        "200":
          description: Suggested place label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseGeocodeResult"
        default:
          $ref: "#/components/responses/Error"
  /photos/upload-intents:
    post:
      operationId: createPhotoUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePhotoUploadIntentRequest"
      responses:
        "201":
          description: Short-lived signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadIntent"
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/stops/{stopId}/photos:
    get:
      operationId: listStopPhotos
      parameters:
        - $ref: "#/components/parameters/JourneyID"
        - {name: stopId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Processed photos with short-lived private thumbnail URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        default: {$ref: "#/components/responses/Error"}
  /photos/{photoId}/complete:
    parameters:
      - {name: photoId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: completePhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePhotoUploadRequest"
      responses:
        "202":
          description: Upload recorded and processing queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoProcessingStatus"
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/shares:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: createJourneyShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Immutable public itinerary snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedShare"
        default:
          $ref: "#/components/responses/Error"
  /shares/{token}:
    get:
      security: []
      operationId: getPublicShare
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Public itinerary snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicItinerary"
        default:
          $ref: "#/components/responses/Error"
  /share-links/{shareId}:
    delete:
      operationId: revokeJourneyShare
      parameters:
        - {name: shareId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Share revoked}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    JourneyID:
      name: journeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    TransportMode:
      type: string
      enum: [motorcycle, car, walking]
      default: motorcycle
    User:
      type: object
      additionalProperties: false
      required: [id, subject, display_name, default_transport_mode, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        display_name: {type: string, maxLength: 160}
        default_transport_mode:
          $ref: "#/components/schemas/TransportMode"
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [display_name, default_transport_mode]
      properties:
        display_name: {type: string, maxLength: 160}
        default_transport_mode: {$ref: "#/components/schemas/TransportMode"}
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [installation_id, platform]
      properties:
        installation_id: {type: string, minLength: 1, maxLength: 255}
        platform: {type: string, enum: [web, android]}
        push_subscription: {type: object, additionalProperties: true}
    Device:
      type: object
      additionalProperties: false
      required: [id, installation_id, platform, last_seen_at]
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: string}
        platform: {type: string, enum: [web, android]}
        last_seen_at: {type: string, format: date-time}
    DeviceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Device"}
    JourneyKind:
      type: string
      enum: [trip, outing]
    JourneyStatus:
      type: string
      enum: [active, ended, expired]
    CreateJourneyRequest:
      type: object
      additionalProperties: false
      required: [kind, label, client_request_id]
      properties:
        kind: {$ref: "#/components/schemas/JourneyKind"}
        label: {type: string, minLength: 1, maxLength: 160}
        client_request_id: {type: string, format: uuid}
    UpdateJourneyRequest:
      type: object
      additionalProperties: false
      required: [label, version]
      properties:
        label: {type: string, minLength: 1, maxLength: 160}
        version: {type: integer, format: int32, minimum: 1}
    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, format: int32, minimum: 1}
    Journey:
      type: object
      additionalProperties: false
      required: [id, kind, label, status, started_at, ended_at, version]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/JourneyKind"}
        label: {type: string}
        status: {$ref: "#/components/schemas/JourneyStatus"}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int32, minimum: 1}
    JourneyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Journey"}
    SavePlaceRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, name, latitude, longitude]
      properties:
        client_request_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        notes: {type: string}
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
    UpdatePlaceRequest:
      type: object
      additionalProperties: false
      required: [name, notes]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        notes: {type: string}
    Place:
      type: object
      additionalProperties: false
      required: [id, client_request_id, name, notes, latitude, longitude, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        client_request_id: {type: string, format: uuid}
        name: {type: string}
        notes: {type: string}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PlaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Place"}
    PinStopRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, name, latitude, longitude, captured_at]
      properties:
        client_request_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        note: {type: string}
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
        captured_at: {type: string, format: date-time}
    UpdateStopRequest:
      type: object
      additionalProperties: false
      required: [name, note]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        note: {type: string}
    JourneyStop:
      type: object
      additionalProperties: false
      required: [id, journey_id, place_id, client_request_id, sequence_number, captured_at, name, note, latitude, longitude]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        place_id: {type: string, format: uuid}
        client_request_id: {type: string, format: uuid}
        sequence_number: {type: integer, format: int64, minimum: 1}
        captured_at: {type: string, format: date-time}
        name: {type: string}
        note: {type: string}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
    JourneyStopList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/JourneyStop"}
    LocationPoint:
      type: object
      additionalProperties: false
      required: [sample_id, captured_at, latitude, longitude]
      properties:
        sample_id: {type: string, format: uuid}
        captured_at: {type: string, format: date-time}
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
        accuracy_m: {type: number, format: float, minimum: 0, nullable: true}
        speed_mps: {type: number, format: float, minimum: 0, nullable: true}
        heading_deg: {type: number, format: float, minimum: 0, maximum: 360, nullable: true}
    LocationIngestResult:
      type: object
      additionalProperties: false
      required: [received, inserted, duplicates, flagged]
      properties:
        received: {type: integer, minimum: 0}
        inserted: {type: integer, minimum: 0}
        duplicates: {type: integer, minimum: 0}
        flagged: {type: integer, minimum: 0}
    GeoJSONLineString:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [LineString]}
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: number, format: double}
    RouteSegment:
      type: object
      additionalProperties: false
      required: [id, number, started_at, ended_at, geometry, distance_m, duration_s, is_map_matched]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int32, minimum: 1}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        geometry: {$ref: "#/components/schemas/GeoJSONLineString"}
        distance_m: {type: number, format: double, minimum: 0}
        duration_s: {type: integer, format: int32, minimum: 0}
        is_map_matched: {type: boolean}
    RouteSegmentList:
      type: object
      additionalProperties: false
      required: [segments]
      properties:
        segments:
          type: array
          items: {$ref: "#/components/schemas/RouteSegment"}
    RoadEstimate:
      type: object
      additionalProperties: false
      required: [distance_m, duration_s]
      properties:
        distance_m: {type: number, format: double, minimum: 0}
        duration_s: {type: integer, format: int32, minimum: 0}
    NearbyRoutes:
      type: object
      additionalProperties: false
      properties:
        motorcycle: {$ref: "#/components/schemas/RoadEstimate"}
        car: {$ref: "#/components/schemas/RoadEstimate"}
        walking: {$ref: "#/components/schemas/RoadEstimate"}
    NearbyPlace:
      type: object
      additionalProperties: false
      required: [place_id, name, latitude, longitude, straight_line_m, routes]
      properties:
        place_id: {type: string, format: uuid}
        name: {type: string}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        straight_line_m:
          type: number
          format: double
          minimum: 0
          description: Internal prefilter diagnostic; not the default displayed distance.
        routes: {$ref: "#/components/schemas/NearbyRoutes"}
    NearbyResult:
      type: object
      additionalProperties: false
      required: [sort_mode, items]
      properties:
        sort_mode: {$ref: "#/components/schemas/TransportMode"}
        items:
          type: array
          items: {$ref: "#/components/schemas/NearbyPlace"}
    ReverseGeocodeResult:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: {type: string}
    PhotoContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    CreatePhotoUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [journey_id, client_request_id, content_type]
      properties:
        journey_id: {type: string, format: uuid}
        stop_id: {type: string, format: uuid, nullable: true}
        client_request_id: {type: string, format: uuid}
        content_type: {$ref: "#/components/schemas/PhotoContentType"}
        captured_at: {type: string, format: date-time, nullable: true}
    PhotoUploadIntent:
      type: object
      additionalProperties: false
      required: [photo_id, upload_url, method, expires_at, max_bytes, content_type]
      properties:
        photo_id: {type: string, format: uuid}
        upload_url: {type: string, format: uri}
        method: {type: string, enum: [PUT]}
        expires_at: {type: string, format: date-time}
        max_bytes: {type: integer, format: int64, minimum: 1}
        content_type: {$ref: "#/components/schemas/PhotoContentType"}
    CompletePhotoUploadRequest:
      type: object
      additionalProperties: false
      properties:
        checksum_sha256:
          type: string
          pattern: "^[A-Fa-f0-9]{64}$|^$"
    PhotoProcessingStatus:
      type: object
      additionalProperties: false
      required: [photo_id, status]
      properties:
        photo_id: {type: string, format: uuid}
        status: {type: string, enum: [uploaded, processed]}
    Photo:
      type: object
      additionalProperties: false
      required: [photo_id, url, captured_at]
      properties:
        photo_id: {type: string, format: uuid}
        url: {type: string, format: uri}
        captured_at: {type: string, format: date-time, nullable: true}
    PhotoList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Photo"}
    ShareItemInput:
      type: object
      additionalProperties: false
      required: [stop_id]
      properties:
        stop_id: {type: string, format: uuid}
        display_name: {type: string, maxLength: 200, nullable: true}
