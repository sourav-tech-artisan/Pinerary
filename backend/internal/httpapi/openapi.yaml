openapi: 3.0.3
info:
  title: Pinerary API
  version: 0.1.0
  description: API for recording journeys, places, route traces, photos, and public itineraries.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current user and preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, default_transport_mode]
              properties:
                display_name: {type: string, maxLength: 160}
                default_transport_mode: {$ref: "#/components/schemas/TransportMode"}
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        default: {$ref: "#/components/responses/Error"}
  /devices:
    get:
      operationId: listDevices
      responses:
        "200": {description: Registered devices}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Device registered
        default:
          $ref: "#/components/responses/Error"
  /devices/{deviceId}:
    delete:
      operationId: deleteDevice
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Device removed}
        default: {$ref: "#/components/responses/Error"}
  /journeys:
    get:
      operationId: listJourneys
      parameters:
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Journeys owned by the current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createJourney
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJourneyRequest"
      responses:
        "201":
          description: Journey created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    get:
      operationId: getJourney
      responses:
        "200":
          description: Journey detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateJourney
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, version]
              properties:
                label: {type: string, minLength: 1, maxLength: 160}
                version: {type: integer, minimum: 1}
      responses:
        "200":
          description: Journey updated
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/end:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: endJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Journey ended
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/convert-to-trip:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: convertOutingToTrip
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200": {description: Outing converted to trip}
        default: {$ref: "#/components/responses/Error"}
  /journeys/{journeyId}/locations/batch:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: ingestLocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/LocationPoint"
      responses:
        "202":
          description: Location samples accepted
          content:
            application/json:
              schema:
                type: object
                required: [received, inserted, duplicates, flagged]
                properties:
                  received: {type: integer}
                  inserted: {type: integer}
                  duplicates: {type: integer}
                  flagged: {type: integer}
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/route:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    get:
      operationId: getJourneyRoute
      responses:
        "200": {description: "Cleaned route segments, map-matched when available"}
        default: {$ref: "#/components/responses/Error"}
  /journeys/{journeyId}/stops:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: addJourneyStop
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PinStopRequest"}
      responses:
        "201":
          description: Stop added to the immutable timeline
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listJourneyStops
      responses:
        "200": {description: Original chronological stop timeline}
        default: {$ref: "#/components/responses/Error"}
  /journeys/{journeyId}/stops/{stopId}:
    patch:
      operationId: updateJourneyStopMetadata
      parameters:
        - $ref: "#/components/parameters/JourneyID"
        - {name: stopId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, note]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                note: {type: string}
      responses:
        "200": {description: Editable stop metadata updated}
        default: {$ref: "#/components/responses/Error"}
  /places:
    get:
      operationId: listPlaces
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200": {description: Saved place library}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: savePlace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SavePlaceRequest"}
      responses:
        "201":
          description: Place saved
        default:
          $ref: "#/components/responses/Error"
  /places/{placeId}:
    parameters:
      - {name: placeId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updatePlace
      responses:
        "200": {description: Place metadata updated}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deletePlace
      responses:
        "204": {description: Place removed from the library}
        default: {$ref: "#/components/responses/Error"}
  /places/nearby:
    get:
      operationId: getNearbyPlaces
      parameters:
        - {name: latitude, in: query, required: true, schema: {type: number, format: double}}
        - {name: longitude, in: query, required: true, schema: {type: number, format: double}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
        - {name: mode, in: query, schema: {$ref: "#/components/schemas/TransportMode"}}
      responses:
        "200":
          description: Saved places ordered by road distance for the selected mode, with all available mode estimates
          content:
            application/json:
              schema:
                type: object
                required: [sort_mode, items]
                properties:
                  sort_mode: {$ref: "#/components/schemas/TransportMode"}
                  items:
                    type: array
                    items:
                      type: object
                      required: [place_id, name, latitude, longitude, routes]
                      properties:
                        place_id: {type: string, format: uuid}
                        name: {type: string}
                        latitude: {type: number, format: double}
                        longitude: {type: number, format: double}
                        straight_line_m:
                          type: number
                          description: Internal prefilter diagnostic; not the default displayed distance.
                        routes:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              distance_m: {type: number}
                              duration_s: {type: integer}
        default:
          $ref: "#/components/responses/Error"
  /places/reverse-geocode:
    get:
      operationId: reverseGeocode
      parameters:
        - {name: latitude, in: query, required: true, schema: {type: number, format: double}}
        - {name: longitude, in: query, required: true, schema: {type: number, format: double}}
      responses:
        "200":
          description: Suggested place label
        default:
          $ref: "#/components/responses/Error"
  /photos/upload-intents:
    post:
      operationId: createPhotoUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journey_id, client_request_id, content_type]
              properties:
                journey_id: {type: string, format: uuid}
                stop_id: {type: string, format: uuid, nullable: true}
                client_request_id: {type: string, format: uuid}
                content_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
                captured_at: {type: string, format: date-time, nullable: true}
      responses:
        "201":
          description: Short-lived signed upload URL
        default:
          $ref: "#/components/responses/Error"
  /photos/{photoId}/complete:
    parameters:
      - {name: photoId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: completePhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checksum_sha256: {type: string}
      responses:
        "202":
          description: Upload recorded and processing queued
        default:
          $ref: "#/components/responses/Error"
  /journeys/{journeyId}/shares:
    parameters:
      - $ref: "#/components/parameters/JourneyID"
    post:
      operationId: createJourneyShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                expires_at: {type: string, format: date-time, nullable: true}
                items:
                  type: array
                  description: Share-only order; omitting it uses the original timeline.
                  items:
                    type: object
                    required: [stop_id]
                    properties:
                      stop_id: {type: string, format: uuid}
                      display_name: {type: string, nullable: true}
                      note: {type: string, nullable: true}
                      photo_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        "201":
          description: Immutable public itinerary snapshot created
        default:
          $ref: "#/components/responses/Error"
  /shares/{token}:
    get:
      security: []
      operationId: getPublicShare
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Public itinerary snapshot
        default:
          $ref: "#/components/responses/Error"
  /share-links/{shareId}:
    delete:
      operationId: revokeJourneyShare
      parameters:
        - {name: shareId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Share revoked}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    JourneyID:
      name: journeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    User:
      type: object
      required: [id, subject, default_transport_mode]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        display_name: {type: string}
        default_transport_mode:
          $ref: "#/components/schemas/TransportMode"
    RegisterDeviceRequest:
      type: object
      required: [installation_id, platform]
      properties:
        installation_id: {type: string, maxLength: 255}
        platform: {type: string, enum: [web, android]}
        push_subscription: {type: object, additionalProperties: true}
    CreateJourneyRequest:
      type: object
      required: [kind, label, client_request_id]
      properties:
        kind: {type: string, enum: [trip, outing]}
        label: {type: string, minLength: 1, maxLength: 160}
        client_request_id: {type: string, format: uuid}
    Journey:
      type: object
      required: [id, kind, label, status, started_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [trip, outing]}
        label: {type: string}
        status: {type: string, enum: [active, ended, expired]}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time, nullable: true}
    LocationPoint:
      type: object
      required: [sample_id, captured_at, latitude, longitude]
      properties:
        sample_id: {type: string, format: uuid}
        captured_at: {type: string, format: date-time}
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
        accuracy_m: {type: number, format: double, minimum: 0}
        speed_mps: {type: number, format: double, minimum: 0}
        heading_deg: {type: number, format: double, minimum: 0, maximum: 360}
    TransportMode:
      type: string
      enum: [motorcycle, car, walking]
      default: motorcycle
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
    SavePlaceRequest:
      type: object
      required: [client_request_id, name, latitude, longitude]
      properties:
        client_request_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        notes: {type: string}
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
    PinStopRequest:
      allOf:
        - $ref: "#/components/schemas/SavePlaceRequest"
        - type: object
          required: [captured_at]
          properties:
            note: {type: string}
            captured_at: {type: string, format: date-time}
